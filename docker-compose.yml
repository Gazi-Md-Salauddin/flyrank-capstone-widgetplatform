services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: widgetplatform
      POSTGRES_USER: widgetplatform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env file}
    ports:
      - "5432:5432"
    volumes:
      - widgetplatform_pgdata:/var/lib/postgresql/data
      - ./src/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U widgetplatform -d widgetplatform"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  widgetplatform_pgdata:
